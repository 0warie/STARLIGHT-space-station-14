- type: entity
  id: SingularityGenerator
  name: gravitational singularity generator
  description: An Odd Device which produces a Gravitational Singularity when set up. Comes with a temporary shutdown containment failsafe.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/generator.rsi
    # Starlight Start - mapped so the charge-up can swap the generator's texture
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SingularityGeneratorVisuals.Charging:
        base:
          # Placeholder: the grounding rod's electrified animation stands in until the generator gets
          # its own sparking texture. Swap the state here once one exists.
          True:
            sprite: Structures/Power/Generation/Tesla/coil.rsi
            state: grounding_rodhit
          False:
            sprite: Structures/Power/Generation/Singularity/generator.rsi
            state: icon
  - type: GeneratorChargeUp
  # Starlight End
  - type: SingularityGenerator
    # Starlight Start - the charge-up spawns a growing core, which becomes the Singularity
    spawnId: EffectSingularitySpawnCore
    # Starlight End
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          # Using a circle here makes it a lot easier to pull it all the way from Cargo
          !type:PhysShapeCircle
            radius: 0.45
        density: 190
        # Keep an eye on ParticlesProjectile when adjusting these
        mask:
        - MachineMask
        layer:
        - Opaque
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
  - type: GuideHelp
    guides:
    - SingularityEngine
    - Power

