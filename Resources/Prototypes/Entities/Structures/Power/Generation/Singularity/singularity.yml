- type: entity
  id: Singularity
  name: gravitational singularity
  description: A mesmerizing swirl of darkness that sucks in everything. If it's moving towards you, run.
  components:
    - type: Clickable
    # Starlight edit: new drone loop. Starts as soon as the singularity exists, which is what you want
    # for one spawned directly. The generator spawns SingularityFormed instead, which holds it off
    # until the formation sound has finished.
    #
    # 0 dB so the loop matches the tail of singularity_form.ogg at the handoff: both files sit at about
    # -14.4 dBFS RMS there and their spectra are within a dB of each other across the band, so any
    # attenuation here just reads as the sound dropping when the singularity lands.
    # Note ambience.volume scales this on top (1.5 gain by default, so roughly +3.5 dB).
    - type: AmbientSound
      volume: 0
      range: 14
      sound:
        path: /Audio/_Starlight/Effects/singularity_drone.ogg
    - type: Physics
      bodyType: Dynamic
      bodyStatus: InAir
    - type: CanMoveInAir
    - type: EventHorizon # To make the singularity consume things.
      radius: 0.5
      canBreachContainment: false
      colliderFixtureId: EventHorizonCollider
      consumerFixtureId: EventHorizonConsumer
    - type: GravityWell # To make the singularity attract things.
      baseRadialAcceleration: 10
      maxRange: 4
    - type: Fixtures
      fixtures:
        EventHorizonCollider:
          shape: !type:PhysShapeCircle
            radius: 0.35
          hard: true
          restitution: 0.8
          density: 99999
          mask:
            - SingularityLayer
          layer:
            - SingularityLayer
        EventHorizonConsumer:
          shape: !type:PhysShapeCircle
            radius: 0.35
          hard: false
          mask:
            - SingularityLayer
          layer:
            - SingularityLayer
    - type: Singularity
      energy: 180
      level: 1
      radsPerLevel: 2
      energyLoss: 1
    - type: RandomWalk # To make the singularity move around.
      maxSpeed: 2.5
      minSpeed: 1.875
    - type: SingularityDistortion
      falloffPower: 2.529822
      intensity: 3645
    - type: RadiationSource
      slope: 0.2 # its emit really far away
      intensity: 2
    - type: PointLight
      enabled: true
      radius: 10
    - type: Appearance
    - type: GuideHelp # Always strive to be helpful in trying times.
      guides:
        - SingularityEngine
        - SingularityTeslaEngine
        - Power
    - type: Tag
      tags:
        - GhostOnlyWarp
    - type: WarpPoint
      follow: true
      location: singularity
      blacklist:
        tags:
          - GhostOnlyWarp
    - type: Sprite
      sprite: Structures/Power/Generation/Singularity/singularity_1.rsi
      layers:
        - map: ["VisualLevel"]
          state: singularity_1
          shader: unshaded
    - type: GenericVisualizer
      visuals:
        enum.SingularityAppearanceKeys.Singularity:
          VisualLevel:
            1:
              sprite: Structures/Power/Generation/Singularity/singularity_1.rsi
              state: singularity_1
              scale: 1.0,1.0
            2:
              sprite: Structures/Power/Generation/Singularity/singularity_2.rsi
              state: singularity_2
              scale: 1.0,1.0
            3:
              sprite: Structures/Power/Generation/Singularity/singularity_3.rsi
              state: singularity_3s   d s
              scale: 1.0,1.0
            4:
              sprite: Structures/Power/Generation/Singularity/singularity_4.rsi
              state: singularity_4
              scale: 1.0,1.0
            5:
              sprite: Structures/Power/Generation/Singularity/singularity_5.rsi
              state: singularity_5
              scale: 1.5,1.5
            6:
              sprite: Structures/Power/Generation/Singularity/singularity_6.rsi
              state: singularity_6
              scale: .9,.9
