- type: entity
  id: SingularityGenerator
  name: gravitational singularity generator
  description: An Odd Device which produces a Gravitational Singularity when set up. Comes with a temporary shutdown containment failsafe.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/generator.rsi
    # Starlight Start - mapped so the charge-up can swap the generator's texture
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SingularityGeneratorVisuals.Charging:
        base:
          True:
            sprite: _Starlight/Structures/Power/Generation/Singularity/generator.rsi
            state: charging
          False:
            sprite: Structures/Power/Generation/Singularity/generator.rsi
            state: icon
  # Sparks have to outlast the core's 2.63s grow-in, which starts at spawnDelay.
  - type: GeneratorChargeUp
    sparkDuration: 6.8
  # Starlight End
  - type: SingularityGenerator
    # Starlight Start - the charge-up spawns a growing core, which becomes the Singularity
    spawnId: EffectSingularitySpawnCore
    # Starlight End
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          # Using a circle here makes it a lot easier to pull it all the way from Cargo
          !type:PhysShapeCircle
            radius: 0.45
        density: 190
        # Keep an eye on ParticlesProjectile when adjusting these
        mask:
        - MachineMask
        layer:
        - Opaque
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: Pullable
  - type: GuideHelp
    guides:
    - SingularityEngine
    - Power

