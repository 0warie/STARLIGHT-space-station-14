# The engine that grows out of a singularity/tesla generator after it has finished charging up.
# The generator handles the sparking itself (see GeneratorChargeUp); these only cover the grow-in.
# Their lifetimes have to fit inside the generator's sparkDuration, or the sparks stop mid-animation.

- type: entity
  id: EffectTeslaSpawnBall
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1.5
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: Structures/Power/Generation/Tesla/energy_ball.rsi
    layers:
    - state: energy_ball_fast
      shader: unshaded
  # Grows into the size and light of the real TeslaEnergyBall it despawns into.
  - type: GrowOnSpawn
    duration: 1.5
    startScale: 0.1,0.1
    endScale: 1,1
    startLightRadius: 1
    endLightRadius: 10
    startLightEnergy: 0.5
    endLightEnergy: 16
  - type: PointLight
    enabled: true
    radius: 1
    energy: 0.5
    color: "#4080FF"
  # Deliberately much weaker than the real tesla so the show can't wreck the containment setup.
  - type: LightningArcShooter
    arcDepth: 1
    maxLightningArc: 1
    shootMinInterval: 0.3
    shootMaxInterval: 0.6
    shootRange: 5
    lightningPrototype: Lightning
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/tesla_consume.ogg
      params:
        variation: 0.3
  # Bridges the gap between the charge-up and the real tesla's own ambience.
  - type: AmbientSound
    volume: -2
    range: 8
    sound:
      path: /Audio/Effects/tesla.ogg
  - type: SpawnOnDespawn
    prototype: TeslaEnergyBall
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: EffectSingularitySpawnCore
  categories: [ HideSpawnMenu ]
  components:
  # 2.63s is where singularity_form.ogg hits its impact: it sits around -14 dB up to 2.610s and jumps
  # to nearly 0 dBFS by 2.640s. The grow-in has to finish exactly there so the singularity lands on it.
  - type: TimedDespawn
    lifetime: 2.63
  - type: Sprite
    drawdepth: Effects
    noRot: true
    sprite: Structures/Power/Generation/Singularity/singularity_1.rsi
    layers:
    - state: singularity_1
      shader: unshaded
  - type: GrowOnSpawn
    duration: 2.63
    startScale: 0.1,0.1
    endScale: 1,1
    startLightRadius: 1
    endLightRadius: 10
    startLightEnergy: 0.5
    endLightEnergy: 1
  - type: PointLight
    enabled: true
    radius: 1
    energy: 0.5
  # Starts with the grow-in, so the sound and the animation begin together.
  # Positional, because the sound outlasts this effect's 1.5s lifetime and would otherwise be cut off
  # when the despawn takes its parented audio stream with it.
  - type: EmitSoundOnSpawn
    positional: true
    sound:
      path: /Audio/_Starlight/Effects/singularity_form.ogg
  - type: SpawnOnDespawn
    prototype: SingularityFormed
  - type: Tag
    tags:
    - HideContextMenu

# The singularity as the generator produces it. Identical to the normal one except that its drone
# waits out the rest of the formation sound, which is still playing when it spawns.
# Kept separate so an admin- or map-spawned Singularity still starts droning immediately.
- type: entity
  id: SingularityFormed
  parent: Singularity
  suffix: Formed
  categories: [ HideSpawnMenu ]
  components:
  - type: AmbientSound
    enabled: false
  # singularity_form.ogg runs 6.641s and this spawns 2.63s into it, so 4.01s of it is left to play.
  - type: DelayedAmbience
    delay: 4.01
